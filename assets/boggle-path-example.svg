<svg xmlns="http://www.w3.org/2000/svg" width="720" height="420" viewBox="0 0 720 420" role="img" aria-labelledby="title desc">
  <title id="title">Boggle path example</title>
  <desc id="desc">A 4 by 4 letter board showing an adjacent path that forms the word SEARCH.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbf9ff"/>
      <stop offset="1" stop-color="#f1ebff"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#3b256f" flood-opacity="0.14"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2 2 10 6 2 10Z" fill="#6d2cf0"/>
    </marker>
  </defs>
  <rect width="720" height="420" rx="26" fill="url(#bg)"/>
  <text x="44" y="54" fill="#1e1735" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="800">Forming one word by walking neighbors</text>
  <text x="44" y="86" fill="#746b91" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="650">Each step may move horizontally, vertically, or diagonally.</text>

  <g filter="url(#shadow)">
    <rect x="52" y="112" width="316" height="256" rx="18" fill="#ffffff" stroke="#e4dcf3" stroke-width="2"/>
    <g font-family="Inter, Arial, sans-serif" font-size="32" font-weight="850" text-anchor="middle" dominant-baseline="middle">
      <g fill="#ffffff" stroke="#6d2cf0" stroke-width="2.5">
        <rect x="80" y="140" width="54" height="54" rx="12"/>
        <rect x="144" y="140" width="54" height="54" rx="12"/>
        <rect x="208" y="140" width="54" height="54" rx="12"/>
        <rect x="272" y="140" width="54" height="54" rx="12"/>
        <rect x="80" y="204" width="54" height="54" rx="12"/>
        <rect x="144" y="204" width="54" height="54" rx="12"/>
        <rect x="208" y="204" width="54" height="54" rx="12"/>
        <rect x="272" y="204" width="54" height="54" rx="12"/>
        <rect x="80" y="268" width="54" height="54" rx="12"/>
        <rect x="144" y="268" width="54" height="54" rx="12"/>
        <rect x="208" y="268" width="54" height="54" rx="12"/>
        <rect x="272" y="268" width="54" height="54" rx="12"/>
      </g>
      <g fill="#f7f2ff" stroke="#6d2cf0" stroke-width="3.5">
        <rect x="80" y="140" width="54" height="54" rx="12"/>
        <rect x="144" y="140" width="54" height="54" rx="12"/>
        <rect x="208" y="204" width="54" height="54" rx="12"/>
        <rect x="272" y="204" width="54" height="54" rx="12"/>
        <rect x="272" y="268" width="54" height="54" rx="12"/>
        <rect x="208" y="268" width="54" height="54" rx="12"/>
      </g>
      <g fill="#231a3d">
        <text x="107" y="167">S</text><text x="171" y="167">E</text><text x="235" y="167">T</text><text x="299" y="167">P</text>
        <text x="107" y="231">A</text><text x="171" y="231">L</text><text x="235" y="231">A</text><text x="299" y="231">R</text>
        <text x="107" y="295">T</text><text x="171" y="295">N</text><text x="235" y="295">H</text><text x="299" y="295">C</text>
      </g>
    </g>
    <path d="M134 167H144" stroke="#6d2cf0" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)"/>
    <path d="M190 185 215 208" stroke="#6d2cf0" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)"/>
    <path d="M262 231H272" stroke="#6d2cf0" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)"/>
    <path d="M299 258V268" stroke="#6d2cf0" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)"/>
    <path d="M272 295H262" stroke="#6d2cf0" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)"/>
  </g>

  <g>
    <rect x="410" y="130" width="250" height="212" rx="18" fill="#ffffff" stroke="#e4dcf3" stroke-width="2"/>
    <text x="435" y="172" fill="#1e1735" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="850">Example word</text>
    <text x="435" y="214" fill="#6d2cf0" font-family="SFMono-Regular, Consolas, monospace" font-size="36" font-weight="850">SEARCH</text>
    <text x="435" y="254" fill="#332b51" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="650">S → E → A → R → C → H</text>
    <text x="435" y="286" fill="#746b91" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="650">The path bends and uses a diagonal step.</text>
    <text x="435" y="313" fill="#746b91" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="650">That is allowed.</text>
  </g>
</svg>
