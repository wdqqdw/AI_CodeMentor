<svg xmlns="http://www.w3.org/2000/svg" width="720" height="420" viewBox="0 0 720 420" role="img" aria-labelledby="title desc">
  <title id="title">Boggle cell reuse rule</title>
  <desc id="desc">A 2 by 2 board showing why a path cannot reuse the same cell while forming a word.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fffdfa"/>
      <stop offset="1" stop-color="#fff4d9"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#5f3b00" flood-opacity="0.13"/>
    </filter>
    <marker id="arrow-orange" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2 2 10 6 2 10Z" fill="#d89513"/>
    </marker>
  </defs>
  <rect width="720" height="420" rx="26" fill="url(#bg)"/>
  <text x="44" y="54" fill="#1e1735" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="800">One path cannot reuse a cell</text>
  <text x="44" y="86" fill="#7a6b51" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="650">Visited cells are locked until the current word search backs out.</text>

  <g filter="url(#shadow)">
    <rect x="56" y="120" width="260" height="220" rx="18" fill="#ffffff" stroke="#efe1be" stroke-width="2"/>
    <text x="88" y="158" fill="#1e1735" font-family="Inter, Arial, sans-serif" font-size="21" font-weight="850">Allowed</text>
    <g font-family="Inter, Arial, sans-serif" font-size="34" font-weight="850" text-anchor="middle" dominant-baseline="middle">
      <g fill="#fff9eb" stroke="#d89513" stroke-width="3">
        <rect x="92" y="188" width="62" height="62" rx="13"/>
        <rect x="170" y="188" width="62" height="62" rx="13"/>
        <rect x="92" y="266" width="62" height="62" rx="13"/>
        <rect x="170" y="266" width="62" height="62" rx="13"/>
      </g>
      <text x="123" y="219" fill="#231a3d">A</text><text x="201" y="219" fill="#231a3d">B</text>
      <text x="123" y="297" fill="#231a3d">C</text><text x="201" y="297" fill="#231a3d">D</text>
    </g>
    <path d="M154 219H170" stroke="#d89513" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow-orange)"/>
    <path d="M201 250V266" stroke="#d89513" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow-orange)"/>
    <text x="88" y="374" fill="#574a35" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700">A → B → D uses three different cells.</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="372" y="120" width="292" height="220" rx="18" fill="#ffffff" stroke="#efe1be" stroke-width="2"/>
    <text x="404" y="158" fill="#1e1735" font-family="Inter, Arial, sans-serif" font-size="21" font-weight="850">Rejected</text>
    <g font-family="Inter, Arial, sans-serif" font-size="34" font-weight="850" text-anchor="middle" dominant-baseline="middle">
      <g fill="#fff9eb" stroke="#d89513" stroke-width="3">
        <rect x="416" y="188" width="62" height="62" rx="13"/>
        <rect x="494" y="188" width="62" height="62" rx="13"/>
        <rect x="416" y="266" width="62" height="62" rx="13"/>
        <rect x="494" y="266" width="62" height="62" rx="13"/>
      </g>
      <rect x="416" y="188" width="62" height="62" rx="13" fill="none" stroke="#d93939" stroke-width="5"/>
      <text x="447" y="219" fill="#231a3d">A</text><text x="525" y="219" fill="#231a3d">B</text>
      <text x="447" y="297" fill="#231a3d">C</text><text x="525" y="297" fill="#231a3d">D</text>
    </g>
    <path d="M478 219H494" stroke="#d89513" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow-orange)"/>
    <path d="M494 219H478" stroke="#d93939" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow-orange)"/>
    <path d="M426 198 468 240M468 198 426 240" stroke="#d93939" stroke-width="6" stroke-linecap="round"/>
    <text x="404" y="374" fill="#574a35" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700">A → B → A tries to use the first A twice.</text>
  </g>
</svg>
